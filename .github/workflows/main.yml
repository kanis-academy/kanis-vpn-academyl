
name: KANIS - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extraire le projet KANIS
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP" || {
            echo "ERREUR : aucun ZIP trouve a la racine du depot"
            exit 1
          }

          unzip -oq "$ZIP" -d project

          APP=$(find project -type f -name package.json \
            -not -path '*/node_modules/*' -print -quit)

          test -n "$APP" || {
            echo "ERREUR : package.json introuvable dans le ZIP"
            exit 1
          }

          echo "APP_DIR=$(dirname "$APP")" >> "$GITHUB_ENV"
          echo "Projet trouve : $(dirname "$APP")"

      - name: Verifier les fichiers KANIS
        run: |
          cd "$APP_DIR"

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/js/config.js
          test -f www/js/kanis-backend.js
          test -f scripts/copy-vendor.js
          test -f scripts/patch-android.js
          test -f resources/icon-only.png
          test -f resources/icon-foreground.png
          test -f resources/icon-background.png
          test -f resources/splash.png
          test -f resources/splash-dark.png

          echo "Tous les fichiers necessaires sont presents."

      - name: Installer les dependances
        run: |
          cd "$APP_DIR"
          npm install

      - name: Generer la bibliotheque Supabase
        run: |
          cd "$APP_DIR"
          npm run vendor
          test -s www/js/vendor/supabase.js
          echo "Supabase genere correctement."

      - name: Creer Android et configurer le lien de connexion
        run: |
          cd "$APP_DIR"
          npm run android:add
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="kanisvpn"' \
            android/app/src/main/AndroidManifest.xml

      - name: Generer les icones Android
        run: |
          cd "$APP_DIR"
          npm run assets

      - name: Synchroniser Capacitor
        run: |
          cd "$APP_DIR"
          npm run sync
          test -s android/app/src/main/assets/public/js/vendor/supabase.js

      - name: Compiler APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparer le fichier KANIS.apk
        run: |
          cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" ./KANIS.apk
          test -s KANIS.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: KANIS-APK
          path: KANIS.apk
          if-no-files-found: error
          retention-days: 30
          
